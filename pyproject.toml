[project]
name = "printer-status"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1.0",
    "printrun", # a submodule, defined below
    "regex>=2024.11.6",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
printer-status = "printer_status:main.main"

[tool.uv.sources]
printrun = { path = "lib/Printrun" }

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = ["lib/**", ".venv/**"]

[tool.ruff]
exclude = ["lib/**", ".venv/**"]
